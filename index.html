<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090B">
<meta name="description" content="Order South Indian food by talking to Petpooja AI.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Petpooja AI &middot; Your virtual captain</title>

<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <!-- The mesh. It lives at app level, behind every message, card and
       control, so when the assistant is thinking the whole screen warms
       up rather than one panel in the middle of it. Resting it is a faint
       ambient wash; thinking raises it and starts the drift. -->
  <div class="amb" id="amb" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <header class="hd">
    <div class="hd__l">
      <div class="mark" id="mark" aria-hidden="true">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.43872 13.4363C2.43995 13.4363 0 10.9964 0 7.9976C0 4.99882 2.43995 2.56 5.43872 2.56C8.4375 2.56 10.8774 4.99995 10.8774 7.99872C10.8774 8.2742 10.6537 8.49795 10.3782 8.49795C10.1027 8.49795 9.87897 8.2742 9.87897 7.99872C9.87897 5.5509 7.88766 3.55959 5.43985 3.55959C2.99203 3.55959 1.00072 5.5509 1.00072 7.99872C1.00072 10.4465 2.99203 12.4378 5.43985 12.4378C5.71532 12.4378 5.93908 12.6616 5.93908 12.9371C5.93908 13.2126 5.71532 13.4363 5.43985 13.4363H5.43872Z"/><path d="M11.4237 13.4364C8.89947 13.4364 6.84631 11.3833 6.84631 8.85899C6.84631 8.58351 7.07007 8.35976 7.34554 8.35976C7.62102 8.35976 7.84478 8.58351 7.84478 8.85899C7.84478 10.8323 9.45042 12.4368 11.4226 12.4368C13.3948 12.4368 15.0005 10.8312 15.0005 8.85899C15.0005 6.88679 13.3948 5.28115 11.4226 5.28115C11.1471 5.28115 10.9234 5.0574 10.9234 4.78192C10.9234 4.50644 11.1471 4.28268 11.4226 4.28268C13.9469 4.28268 16 6.33584 16 8.86012C16 11.3844 13.9469 13.4375 11.4226 13.4375L11.4237 13.4364Z"/></svg>
      </div>
      <div class="hd__t">
        <button class="ttl" id="ttl" aria-expanded="false" aria-controls="isl"
                aria-label="Switch chat">
          <span class="hd__n" id="ttlName">Petpooja AI</span>
          <span class="ttl__n" id="ttlCount" aria-hidden="true">1</span>
          <svg data-i viewBox="0 0 24 24"><path d="M6.5 9.2 12 14.7l5.5-5.5"/></svg>
        </button>
        <div class="hd__s"><span class="hd__dot"></span><span id="ttlSub">Your virtual captain</span></div>
      </div>
    </div>
    <div class="hd__r">
      <button class="ico" id="theme" aria-label="Switch theme"></button>
    </div>
  </header>

  <main class="th" id="th" role="log" aria-live="polite" tabindex="-1"></main>

  <!-- The suggestion chips used to live up here, stacked on the composer.
       They belong to the reply that offered them, so they render in the
       thread instead — see setChips(). -->
  <div class="dk">
    <div class="cw">
      <!-- Two states, one set of controls. Resting it's a single line with
           the cart on the left; focused, the field opens above and the
           controls stay exactly where they were — the composer grows upward
           off the bottom-anchored dock, so they never move. -->
      <div class="cp" id="cp">
        <label class="sr" for="inp">Ask Petpooja AI</label>
        <span class="cp__sweep" aria-hidden="true"><i></i></span>

        <button class="cbt cbt--cart" id="cartBtn" data-a="order" aria-label="View your order">
          <svg data-i viewBox="0 0 24 24"><path d="M2.8 4h2.4l2.5 10.6h9.6l2.3-7.8H6.2"/><circle cx="9.6" cy="19" r="1.5"/><circle cx="17.4" cy="19" r="1.5"/></svg>
          <span class="ring" aria-hidden="true"></span>
          <span class="cbt__n" id="cartN" aria-live="polite">0</span>
        </button>

        <textarea id="inp" rows="1" placeholder=" " enterkeyhint="send"></textarea>
        <!-- A real placeholder attribute can't animate, so the resting hint
             is its own element. It's aria-hidden and mirrored by the <label>
             above, so screen readers get one name, not eight rotating ones. -->
        <div class="ph" id="ph" aria-hidden="true"><span></span></div>

        <button class="cbt" id="mic" aria-label="Speak your order">
          <svg data-i viewBox="0 0 24 24"><rect x="9.2" y="2.9" width="5.6" height="10.6" rx="2.8"/><path d="M5.9 11.4a6.1 6.1 0 0 0 12.2 0M12 17.6V21"/></svg>
        </button>
        <button class="snd" id="send" aria-label="Send" disabled>
          <svg data-i viewBox="0 0 24 24"><path d="M7.3 16.7 16.6 7.4M9.1 7.4h7.5v7.5"/></svg>
        </button>
      </div>
    </div>

      <!-- Attribution. The real PETPOOJA logotype, exported from the Figma
           file rather than redrawn: the letterforms ride on currentColor so
           they follow the theme, and the two arcs keep the brand red the
           logo actually uses. Inlined because an <img> can't inherit
           currentColor, and a mask can't carry two colours.

           The viewBox is measured, not eyeballed: the letterforms start at
           y=3.08 but the two arcs start at y=0, so a box beginning at 3.08
           sliced the tops clean off both of them. -->
      <p class="fin"><span>Petpooja AI is always learning.</span>

86.2785 3.48434 86.2785 3.98236V12.7858C86.2785 15.9024 83.7781 18.4216 80.6811 18.4459C80.2114 18.4459 79.8147 18.0716 79.8147 17.5978C79.8147 17.124 80.1857 16.6996 80.6811 16.6996C82.8113 16.6996 84.5698 14.9541 84.5698 12.785V3.98236C84.5698 3.48434 84.9408 3.08496 85.3864 3.08496H85.3872Z" fill="currentColor"/> <path d="M93.2723 3.60902C93.396 3.26057 93.7677 3.08594 94.1138 3.08594C94.4599 3.08594 94.7835 3.26138 94.9561 3.60902L100.653 17.2495C100.851 17.6974 100.653 18.1712 100.207 18.3717C100.108 18.4218 100.009 18.446 99.8847 18.446C99.5627 18.446 99.2648 18.2472 99.1171 17.923L97.8548 14.93H90.3504L89.1122 17.923C88.9894 18.248 88.6425 18.446 88.3197 18.446C88.2201 18.446 88.0965 18.4218 87.9969 18.3717C87.5513 18.1728 87.3529 17.6982 87.5513 17.2495L93.2723 3.60902ZM94.1138 5.97864L91.0682 13.2347H97.1121L94.1138 5.97864Z" fill="currentColor"/> </g> <g> <path d="M60.2724 18.4671C55.2154 18.4671 51.1018 14.3253 51.1018 9.23353C51.1018 4.14179 55.2154 0 60.2724 0C65.3294 0 69.443 4.14179 69.443 9.23353C69.443 9.70244 69.0656 10.0824 68.5999 10.0824C68.1341 10.0824 67.7568 9.70244 67.7568 9.23353C67.7568 5.07799 64.3988 1.69698 60.2716 1.69698C56.1444 1.69698 52.7864 5.07799 52.7864 9.23353C52.7864 13.3891 56.1444 16.7701 60.2716 16.7701C60.7373 16.7701 61.1147 17.1501 61.1147 17.619C61.1147 18.0879 60.7373 18.4679 60.2716 18.4679L60.2724 18.4671Z" fill="#C42031"/> <path d="M70.3647 18.4671C66.1082 18.4671 62.645 14.9802 62.645 10.6945C62.645 10.2256 63.0224 9.84561 63.4881 9.84561C63.9538 9.84561 64.3312 10.2256 64.3312 10.6945C64.3312 14.044 67.038 16.7693 70.3647 16.7693C73.6913 16.7693 76.3981 14.044 76.3981 10.6945C76.3981 7.34501 73.6913 4.61966 70.3647 4.61966C69.8989 4.61966 69.5215 4.23968 69.5215 3.77077C69.5215 3.30186 69.8989 2.92188 70.3647 2.92188C74.6211 2.92188 78.0843 6.4088 78.0843 10.6945C78.0843 14.9802 74.6211 18.4671 70.3647 18.4671Z" fill="#C42031"/> </g> </g></svg></span></span>
      </p>
  </div>
</div>

<!-- Kitchen note editor. Uses the native popover API so it lives in the top
     layer and can't be clipped by the order widget's own overflow, and gets
     light-dismiss and Esc for free. Falls back to a plain fixed panel. -->
<div class="ntp" id="ntpop" popover role="dialog" aria-label="Note for the kitchen">
  <div class="ntp__b" id="ntpopBody"></div>
  <div class="ntp__f">
    <button class="b b--p b--bl" data-a="ntdone">Done</button>
  </div>
</div>

<div class="islScrim" id="islScrim"></div>
<section class="isl" id="isl" role="dialog" aria-label="Your chats">
  <div class="isl__h"><h4>Your chats</h4></div>
  <div class="isl__l" id="islList"></div>
</section>

<div class="tst" id="tst" role="status" aria-live="polite"></div>

<!-- GSAP. Motion is decoration only: the app is fully usable if this fails. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<!-- Plain scripts in dependency order. No bundler, no build step — this is
     exactly what Netlify serves. -->
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/menu.js"></script>
<script src="js/cart.js"></script>
<script src="js/ai.js"></script>
<script src="js/motion.js"></script>
<script src="js/ui-parts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
